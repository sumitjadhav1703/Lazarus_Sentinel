[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[project]
name = "lazarus-sentinel"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.12,<3", "networkx>=3.5,<4"]

[project.scripts]
lazarus = "lazarus_sentinel.cli:main"

[project.optional-dependencies]
langgraph = [
    "langgraph==1.2.19",
]
context-mcp = [
    "mcp>=1.26,<2",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "mypy>=2.4.1,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
